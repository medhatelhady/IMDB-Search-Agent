services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: movie_agent_db
    environment:
      POSTGRES_USER: movie_agent
      POSTGRES_PASSWORD: movie_agent_pass
      POSTGRES_DB: movie_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movie_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
